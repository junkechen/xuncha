plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.gzpatrol.gzxc"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications 需要
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.gzpatrol.gzxc"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        // 只保留arm64-v8a架构，大大减小APK体积
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            // 启用R8代码压缩和资源压缩
            minifyEnabled true
            shrinkResources true
            // R8混淆规则 - 保留必要的类
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug模式保持原样，不压缩以便调试
            minifyEnabled false
        }
    }

    // 自定义 APK 文件名，自动包含版本号（如 gzxc-v3.7.4.apk）
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "gzxc-v${variant.versionName}.apk"
        }
    }

}

flutter {
    source = "../.."
}

dependencies {
    // flutter_local_notifications 要求 Java 8+ API desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

// 强制使用兼容 AGP 8.5.0 的 androidx 版本
configurations.all {
    resolutionStrategy {
        force 'androidx.browser:browser:1.8.0'
        force 'androidx.activity:activity-ktx:1.9.0'
        force 'androidx.activity:activity:1.9.0'
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.core:core:1.13.1'
        force 'androidx.navigationevent:navigationevent-android:1.0.0'
    }
}
